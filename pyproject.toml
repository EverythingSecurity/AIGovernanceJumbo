[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicontrols"
version = "0.4.0"
description = "Cross-mapped AI governance and security controls (ISO 42001, 27001, EU AI Act, GDPR, NIST AI RMF, MITRE ATLAS and more) as data, a Python API and a CLI."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AI Controls Framework contributors" }]
keywords = ["ai-governance", "grc", "iso-42001", "eu-ai-act", "nist-ai-rmf", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/EverythingSecurity/AIGovernanceJumbo"
Issues = "https://github.com/EverythingSecurity/AIGovernanceJumbo/issues"

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]

[project.scripts]
aicontrols = "aicontrols.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aicontrols"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "aicontrols/data"

[tool.hatch.build.targets.sdist]
include = ["src", "data", "schema", "tests", "tools", "docs", "examples", "LICENSE", "NOTICE", "DISCLAIMER.md", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
